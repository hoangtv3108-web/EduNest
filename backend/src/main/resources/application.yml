spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/edunest}
    username: ${DB_USER:edunest_app}
    password: ${DB_PASSWORD:edunest_app}
  flyway:
    user: ${FLYWAY_USER:edunest_owner}
    password: ${FLYWAY_PASSWORD:edunest_owner}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/edunest}

keycloak:
  base-url: ${KEYCLOAK_BASE_URL:http://localhost:8081}
  realm: ${KEYCLOAK_REALM:edunest}
  client-id: ${KEYCLOAK_CLIENT_ID:edunest-backend}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:edunest-backend-dev-secret}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always