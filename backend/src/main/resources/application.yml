spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  mail:
    host: ${SMTP_HOST:}           
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/edunest}
    username: ${DB_USER:edunest_app}
    password: ${DB_PASSWORD:edunest_app}
  flyway:
    user: ${FLYWAY_USER:edunest_owner}
    password: ${FLYWAY_PASSWORD:edunest_owner}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/edunest}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/edunest/protocol/openid-connect/certs}

server:
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

keycloak:
  base-url: ${KEYCLOAK_BASE_URL:http://localhost:8081}
  realm: ${KEYCLOAK_REALM:edunest}
  client-id: ${KEYCLOAK_CLIENT_ID:edunest-backend}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:edunest-backend-dev-secret}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

edunest:
  nhac-no:
    bat-tu-dong: ${NHAC_NO_BAT_TU_DONG:true}
    cron: ${NHAC_NO_CRON:0 0 8 * * *}          
    so-ngay-truoc-toi-thieu: 2                  
    so-ngay-truoc-toi-da: 3
    so-lan-thu-lai-toi-da: 3                   
    kenh-gui: ${NHAC_NO_KENH_GUI:EMAIL}         
    email:
      tu-dia-chi: ${NHAC_NO_EMAIL_FROM:no-reply@edunest.local}
    zalo:
      webhook-url: ${ZALO_ZNS_WEBHOOK_URL:}
      access-token: ${ZALO_ZNS_ACCESS_TOKEN:}
      template-id: ${ZALO_ZNS_TEMPLATE_ID:}