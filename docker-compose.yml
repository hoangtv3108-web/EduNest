services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: edunest
      POSTGRES_USER: edunest
      POSTGRES_PASSWORD: edunest
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edunest -d edunest"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/edunest
      DB_USER: edunest
      DB_PASSWORD: edunest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
