name: CI
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: edunest
          POSTGRES_USER: edunest
          POSTGRES_PASSWORD: edunest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edunest -d edunest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PostgreSQL Roles
        run: |
          docker cp db/init/01_roles.sql $(docker ps -qf "name=postgres"):/01_roles.sql
          docker exec $(docker ps -qf "name=postgres") psql -U edunest -d edunest -f /01_roles.sql

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Backend Tests
        run: mvn -B test
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/edunest
          DB_USER: edunest_app
          DB_PASSWORD: edunest_app
          FLYWAY_USER: edunest_owner
          FLYWAY_PASSWORD: edunest_owner
          KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/edunest

      - name: Lưu báo cáo test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend

  compose-smoke:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tạo chứng chỉ HTTPS dev
        run: |
          mkdir -p certs
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout certs/edunest.key -out certs/edunest.crt \
            -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost"
      - run: docker compose up -d --build
      - name: Chờ backend sẵn sàng
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/hello && exit 0
            sleep 3
          done
          docker compose logs
          exit 1
      - name: Kiểm tra HTTPS và chuyển hướng
        run: |
          curl -ksf -o /dev/null https://localhost:3443/
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ | grep 301
      - name: Dọn dẹp
        if: always()
        run: docker compose down -v
