services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: edunest
      POSTGRES_USER: edunest
      POSTGRES_PASSWORD: edunest
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U edunest -d edunest" ]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/edunest
      DB_USER: edunest_app
      DB_PASSWORD: edunest_app
      FLYWAY_USER: edunest_owner
      FLYWAY_PASSWORD: edunest_owner
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/edunest
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/edunest/protocol/openid-connect/certs

    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
